[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stardew-akinator"
version = "1.0.0"
description = "Rule-based expert system inspired by Akinator and Stardew Valley."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
stardew-akinator = "Frontend.app:main"

[tool.setuptools.packages.find]
include = ["Frontend*"]

[tool.setuptools.package-data]
Frontend = ["images/*.png", "images/*.gif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]
