[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stardew-akinator"
version = "1.0.0"
description = "Rule-based expert system inspired by Akinator and Stardew Valley."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=9.0",
]

[project.optional-dependencies]
dev = [
    "bandit>=1.7",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pyinstaller>=6.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.scripts]
stardew-akinator = "Frontend.app:main"

[tool.setuptools.packages.find]
include = ["Frontend*"]

[tool.setuptools.package-data]
Frontend = ["images/*.png", "images/*.gif"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --cov=Frontend.game_controller --cov=Frontend.scheme_bridge --cov=Frontend.logging_config --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
branch = true

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [".venv", "Backend/compiled", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
files = ["Frontend", "tests"]
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_configs = true
