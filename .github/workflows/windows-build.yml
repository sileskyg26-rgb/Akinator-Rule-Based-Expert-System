name: Windows desktop artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build Windows executable
        run: |
          pyinstaller --clean --noconfirm stardew-akinator.spec

      - name: Create distributable archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/stardew-akinator.exe -DestinationPath stardew-akinator-windows.zip

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: stardew-akinator-windows
          path: stardew-akinator-windows.zip
