name: CI Stardew Akinator

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run Python unit tests
      run: |
        python -m unittest discover -s tests -v

    - name: Check Python linting
      run: |
        ruff check .

    - name: Check Python formatting
      run: |
        ruff format --check .

    - name: Check Python types
      run: |
        mypy Frontend tests

    - name: Set up Racket
      uses: BogdanPopa/setup-racket@v1
      with:
        architecture: 'x64'
        distribution: 'full'
        version: 'stable'

    - name: Validate Racket knowledge base
      run: |
        racket Backend/validador.rkt

    - name: Run Racket backend tests
      run: |
        racket Backend/tests/test-motor.rkt

    - name: Run Python-Racket integration tests
      run: |
        python -m unittest tests.test_integration_bridge -v
